name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新，避免版本号递增任务相互冲突
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # —— 流程校验：lint + 类型检查 + 构建 ——
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 类型检查 + 构建
        run: npm run build

  # —— 版本递增 + 发布 npm：仅 push 到 main 且校验通过后执行 ——
  bump-version:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉取完整历史并使用可推送的 token
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 配置发布目标源，配合 NODE_AUTH_TOKEN 完成鉴权
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: npm ci

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 检查 NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::未配置 GitHub Secret「NPM_TOKEN」，或值为空。请用 npm 账号 zzy1287783907 创建具有 Publish 权限的 token，并写入仓库 Settings → Secrets → Actions → NPM_TOKEN"
            exit 1
          fi

      - name: 递增 patch 版本号
        # [skip ci] 提交信息避免再次触发本工作流，形成死循环
        run: |
          npm version patch -m "chore: 版本号递增至 %s [skip ci]"

      - name: 发布到 npm
        # npm publish 会触发 prepublishOnly 钩子自动构建 dist
        # 若返回 E404：通常是 token 无效，或 token 所属账号不是包维护者（无权发布时 npm 也会报 404）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: 推送版本提交与标签
        run: git push --follow-tags origin main
