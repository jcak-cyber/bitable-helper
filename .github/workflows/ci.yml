name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新，避免版本号递增任务相互冲突
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # —— 流程校验：lint + 类型检查 + 构建 ——
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 类型检查 + 构建
        run: npm run build

  # —— 版本递增 + 发布 npm（OIDC Trusted Publisher，无需 NPM_TOKEN）——
  # 注意：npm 后台 Trusted Publisher 的 Workflow filename 须为「ci.yml」
  bump-version:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推送版本提交与 tag
      id-token: write # OIDC：向 npm 证明本 workflow 身份
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 需要 npm CLI >= 11.5.1；Node 24 自带满足要求
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 确保 npm 支持 OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm -v

      - name: 安装依赖
        run: npm ci

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 递增 patch 版本号
        # [skip ci] 提交信息避免再次触发本工作流，形成死循环
        run: |
          npm version patch -m "chore: 版本号递增至 %s [skip ci]"

      - name: 发布到 npm
        # 使用 Trusted Publisher（OIDC），不要设置 NODE_AUTH_TOKEN / NPM_TOKEN
        # 否则会走旧 token 鉴权并覆盖 OIDC
        run: npm publish --access public

      - name: 推送版本提交与标签
        run: git push --follow-tags origin main
