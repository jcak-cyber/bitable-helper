# npm Trusted Publisher 的 Workflow filename 必须配成「ci.yml」（仅文件名）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint 代码规范检查
        run: npm run lint

      - name: 类型检查 + 构建
        run: npm run build

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不要设置 registry-url：会写入空的 _authToken，导致 npm 跳过 OIDC
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@latest
          echo "node=$(node -v) npm=$(npm -v)"

      - name: 移除会阻断 OIDC 的 auth 配置
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          for f in \
            .npmrc \
            "$HOME/.npmrc" \
            "${NPM_CONFIG_USERCONFIG:-}" \
            "$RUNNER_TEMP/.npmrc"
          do
            [ -n "$f" ] && [ -f "$f" ] || continue
            sed -i '/_authToken/d' "$f" || true
            sed -i '/\/\/registry.npmjs.org\/:_authToken/d' "$f" || true
            echo "==== $f ===="
            cat "$f" || true
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::缺少 ACTIONS_ID_TOKEN_REQUEST_URL，请确认 job permissions 含 id-token: write"
            exit 1
          fi
          echo "OIDC 环境已就绪"

      - name: 安装依赖
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm ci

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 递增 patch 版本号
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm version patch -m "chore: 版本号递增至 %s [skip ci]"

      - name: 发布到 npm（OIDC Trusted Publisher）
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm publish --access public --loglevel verbose

      - name: 推送版本提交与标签
        run: git push --follow-tags origin main
