# npm Trusted Publisher 必须把 Workflow filename 配成「publish.yml」（仅文件名）
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 不要设置 registry-url：会写入空的 _authToken，导致 npm 跳过 OIDC
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 升级 npm（Trusted Publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@latest
          echo "node=$(node -v) npm=$(npm -v)"

      - name: 移除会阻断 OIDC 的 auth 配置
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          # setup-node / 全局可能写入的 npmrc
          for f in \
            .npmrc \
            "$HOME/.npmrc" \
            "${NPM_CONFIG_USERCONFIG:-}" \
            "$RUNNER_TEMP/.npmrc"
          do
            [ -n "$f" ] && [ -f "$f" ] || continue
            # 删掉 authToken 行，保留 registry
            sed -i '/_authToken/d' "$f" || true
            sed -i '/\/\/registry.npmjs.org\/:_authToken/d' "$f" || true
            echo "==== $f ===="
            cat "$f" || true
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::缺少 ACTIONS_ID_TOKEN_REQUEST_URL，请确认 job permissions 含 id-token: write"
            exit 1
          fi
          echo "OIDC 环境已就绪"

      - name: 安装依赖
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm ci

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 校验通过后再发版
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm run lint
          npm run build

      - name: 递增 patch 版本号
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm version patch -m "chore: 版本号递增至 %s [skip ci]"

      - name: 发布到 npm（OIDC Trusted Publisher）
        # 禁止携带任何 npm token，否则不会走 OIDC
        run: |
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true
          npm publish --access public --loglevel verbose

      - name: 推送版本提交与标签
        run: git push --follow-tags origin main
